<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin — configuración</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/estudio/tokens.css">
<link rel="stylesheet" href="ds/estudio/components/bundle.css">
<script src="ds/estudio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:var(--surface)}
a{color:var(--link)}a:hover{color:var(--link-hover)}
.card img{transition:transform .7s cubic-bezier(.2,.8,.2,1)}.card:hover img{transform:scale(1.045)}
.row:hover{background:var(--surface-sunken)}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; font-family: var(--font-sans); color: var(--ink); background: var(--surface)">
<x-import component-from-global-scope="Estudio.SideNav" items="{{nav}}" home-href="AdminPanel.dc.html" store-href="Main.dc.html" logout-href="AdminLogin.dc.html" style="display: flex; flex: 1 1 240px"></x-import>
<main style="flex: 999 1 560px; min-width: 0; padding: 44px var(--space-12) 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-7)">
<div style="display: flex; flex-direction: column; gap: var(--space-2)"><h1 class="display-md" style="margin: 0; color: var(--ink)">Configuración</h1><p class="body-sm" style="margin: 0; color: var(--ink-muted)">Lo que el comprador ve al elegir la entrega.</p></div>
<x-import component-from-global-scope="Estudio.Card" as="form" aria-label="Configuración de la tienda" style="max-width: 560px">
<x-import component-from-global-scope="Estudio.Field" label="Costo de envío" prefix="USD" mono="{{yes}}" input-mode="decimal" placeholder="4.50" hint="Se suma al total cuando el comprador elige envío a domicilio." style="max-width: 240px"></x-import>
<x-import component-from-global-scope="Estudio.Field" label="Instrucciones de retiro" as="textarea" rows="{{n4}}" placeholder="Dónde, cuándo y cómo retirar las copias impresas" hint="Aparece en la pantalla de pago y en la confirmación."></x-import>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding-top: var(--space-2); border-top: 1px solid var(--line)">
<x-import component-from-global-scope="Estudio.Button" variant="primary">Guardar</x-import>
<x-import component-from-global-scope="Estudio.Alert" tone="success">Guardado.</x-import>
</div>
</x-import>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const A = 'config';
return { yes: true, nav: [
{ label: 'Panel', icon: 'panel', href: 'AdminPanel.dc.html', active: A === 'panel' },
{ label: 'Eventos y fotos', icon: 'eventos', href: 'AdminEventos.dc.html', active: A === 'eventos' },
{ label: 'Productos y precios', icon: 'productos', href: 'AdminProductos.dc.html', active: A === 'productos' },
{ label: 'Pedidos', icon: 'pedidos', href: 'AdminPedidos.dc.html', active: A === 'pedidos' },
{ label: 'Lista de impresión', icon: 'impresion', href: 'AdminImpresion.dc.html', active: A === 'impresion' },
{ label: 'Configuración', icon: 'configuracion', href: 'AdminConfig.dc.html', active: A === 'config' }
], n4: 4 };
}
}
</script>
</body>
</html>
