<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Admin — eventos</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/estudio/tokens.css">
<link rel="stylesheet" href="ds/estudio/components/bundle.css">
<script src="ds/estudio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:var(--surface)}
a{color:var(--link)}a:hover{color:var(--link-hover)}
.card img{transition:transform .7s cubic-bezier(.2,.8,.2,1)}.card:hover img{transform:scale(1.045)}
.row:hover{background:var(--surface-sunken)}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; font-family: var(--font-sans); color: var(--ink); background: var(--surface)">
<x-import component-from-global-scope="Estudio.SideNav" items="{{nav}}" home-href="AdminPanel.dc.html" store-href="Main.dc.html" logout-href="AdminLogin.dc.html" style="display: flex; flex: 1 1 240px"></x-import>
<main style="flex: 999 1 560px; min-width: 0; padding: 44px var(--space-12) 72px; box-sizing: border-box; display: flex; flex-direction: column; gap: var(--space-7)">
<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--space-4)">
<h1 class="display-md" style="margin: 0; color: var(--ink)">Eventos</h1>
<x-import component-from-global-scope="Estudio.Button" variant="primary" icon="mas" href="AdminEvento.dc.html">Nuevo evento</x-import>
</div>
<ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; border-radius: var(--radius-lg); background: var(--surface-raised); border: 1px solid var(--line); overflow: hidden">
<sc-for list="{{events}}" as="e" hint-placeholder-count="3">
<li class="row" style="display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-5); border-bottom: 1px solid var(--line)">
<a href="AdminEvento.dc.html" style="display: flex; align-items: center; gap: var(--space-4); flex: 1 1 280px; min-width: 0; text-decoration: none; color: var(--ink)">
<img src="{{e.src}}" alt="" style="width: 88px; height: 62px; object-fit: cover; border-radius: var(--radius-sm); background: var(--surface-sunken)">
<span style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><strong class="display-xs">{{e.name}}</strong><span class="mono-sm" style="color: var(--ink-muted)">{{e.meta}}</span></span>
</a>
<span class="mono-sm" style="color: var(--ink-muted); min-width: 64px">{{e.count}}</span>
<x-import component-from-global-scope="Estudio.Badge" status="{{e.status}}"></x-import>
<x-import component-from-global-scope="Estudio.Button" icon="siguiente" icon-only="{{yes}}" variant="ghost" href="AdminEvento.dc.html">Abrir {{e.name}}</x-import>
</li>
</sc-for>
</ul>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() {
const A = 'eventos';
return { yes: true, nav: [
{ label: 'Panel', icon: 'panel', href: 'AdminPanel.dc.html', active: A === 'panel' },
{ label: 'Eventos y fotos', icon: 'eventos', href: 'AdminEventos.dc.html', active: A === 'eventos' },
{ label: 'Productos y precios', icon: 'productos', href: 'AdminProductos.dc.html', active: A === 'productos' },
{ label: 'Pedidos', icon: 'pedidos', href: 'AdminPedidos.dc.html', active: A === 'pedidos' },
{ label: 'Lista de impresión', icon: 'impresion', href: 'AdminImpresion.dc.html', active: A === 'impresion' },
{ label: 'Configuración', icon: 'configuracion', href: 'AdminConfig.dc.html', active: A === 'config' }
], events: [
{ name: 'Carrera 10K', meta: '[FECHA] · [LUGAR]', count: '3 fotos', status: 'publicado', src: '/_blob/400d42237833f63c33d053356087e127' },
{ name: '[NOMBRE DEL EVENTO]', meta: '[FECHA]', count: '0 fotos', status: 'borrador', src: '/_blob/2c163dcc6473da3e8a6c5e7da7a360e0' },
{ name: '[NOMBRE DEL EVENTO]', meta: '[FECHA] · [LUGAR]', count: '1 foto', status: 'publicado', src: '/_blob/d034addde3e3dd536eac3cf5d95daf41' }
] };
}
}
</script>
</body>
</html>
