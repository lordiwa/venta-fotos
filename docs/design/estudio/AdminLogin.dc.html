<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Acceso del fotógrafo</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/estudio/tokens.css">
<link rel="stylesheet" href="ds/estudio/components/bundle.css">
<script src="ds/estudio/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&amp;family=DM+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:var(--surface)}
a{color:var(--link)}a:hover{color:var(--link-hover)}
.card img{transition:transform .7s cubic-bezier(.2,.8,.2,1)}.card:hover img{transform:scale(1.045)}
.row:hover{background:var(--surface-sunken)}
</style>
</helmet>
<div style="min-height: 900px; display: flex; flex-wrap: wrap; font-family: var(--font-sans); color: var(--ink); background: var(--surface)">
<section aria-hidden="true" style="flex: 1 1 420px; position: relative; min-height: 360px; overflow: hidden; background: var(--rail)">
<img src="/_blob/72fb28c5c4e21d772669fcb75153ed8d" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.9">
<div style="position: absolute; inset: 0; background: linear-gradient(180deg, #15140f1a 0%, #15140fd9 100%)"></div>
<div style="position: relative; display: flex; flex-direction: column; justify-content: space-between; height: 100%; min-height: 360px; padding: var(--space-10); box-sizing: border-box; color: var(--on-rail)">
<x-import component-from-global-scope="Estudio.Wordmark" on-rail="{{yes}}"></x-import>
<div style="display: flex; flex-direction: column; gap: var(--space-3)">
<span class="eyebrow" style="text-transform: uppercase; color: var(--amber)">Panel del fotógrafo</span>
<span class="display-lg" style="font-size: 44px; max-width: 14ch; text-wrap: balance; color: var(--on-rail)">Tus eventos, tus fotos, tus pedidos.</span>
</div>
</div>
</section>
<main style="flex: 1 1 420px; display: flex; align-items: center; justify-content: center; padding: var(--space-12) var(--space-10); box-sizing: border-box">
<form style="display: flex; flex-direction: column; gap: var(--space-4); width: 100%; max-width: 380px">
<div style="display: flex; flex-direction: column; gap: var(--space-2); margin-bottom: var(--space-2)">
<h1 class="display-md" style="margin: 0; font-size: 34px">Acceso del fotógrafo</h1>
<p class="body-sm" style="margin: 0; color: var(--ink-muted)">Entra con el correo y la contraseña de tu cuenta.</p>
</div>
<x-import component-from-global-scope="Estudio.Field" label="Correo" type="email" auto-complete="username" default-value="estudio@" error="[MENSAJE DE VALIDACIÓN DEL CORREO]"></x-import>
<x-import component-from-global-scope="Estudio.Field" label="Contraseña" type="password" auto-complete="current-password"></x-import>
<x-import component-from-global-scope="Estudio.Alert" tone="danger">[ERROR DE ACCESO]</x-import>
<x-import component-from-global-scope="Estudio.Button" variant="primary" size="lg" type="submit">Entrar</x-import>
</form>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":900}}'>
class Component extends DCLogic {
renderVals() { return { yes: true }; }
}
</script>

</html>
